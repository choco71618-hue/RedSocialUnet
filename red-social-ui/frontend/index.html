   Modo claro profesional + dark mode · Referencia: X/Twitter limpio
   ============================================================
   SPEC (pre-flight):
   - 1 acento por página · acento = azul #5b8dee (no mezclar)
   - Radios bloqueados: inputs/botones 10px · feed-cards 0 (flush)

   - Sombras teñidas de azul-gris (nunca negro puro)

   - Motion solo transform/opacity · respeta prefers-reduced-motion
   ============================================================ */


:root,
html {
    /* Paleta clara profesional */
    --rs-bg: #f4f6fb;
    --rs-surface: #ffffff;
    --rs-surface-2: #f8faff;
    --rs-card: #ffffff;
    --rs-card-2: #ffffff;
    --rs-hairline: #e6e9f2;
    --rs-hairline-2: #eef1f7;
    --rs-text: #161d2c;
    --rs-text-dim: #5c6675;
    --rs-faint: #8a93a3;
    --rs-accent: #5b8dee;
    --rs-accent-strong: #356fd3;
    --rs-accent-tint: #eef4ff;
    --rs-ring: rgba(91, 141, 238, 0.22);
    --rs-like: #e0455f;
    --rs-success: #1f9d6b;

    --rs-radius-m: 14px;
    --rs-radius-l: 18px;
    --rs-radius-xl: 22px;
    --rs-pill: 999px;
    --rs-ease: cubic-bezier(0.28, 0.7, 0.25, 1);

    /* Lumo overrides (tema claro) */
    --lumo-base-color: #ffffff;
    --lumo-primary-color: #5b8dee;
    --lumo-primary-color-50pct: rgba(91, 141, 238, 0.5);
    --lumo-primary-color-10pct: rgba(91, 141, 238, 0.12);

    --lumo-tint-0: #f4f6fb;
    --lumo-tint-5pct: rgba(var(--rs-ink), 0.05);
    --lumo-tint-10pct: rgba(var(--rs-ink), 0.09);
    --lumo-tint-20pct: rgba(var(--rs-ink), 0.18);
    --lumo-shade-5pct: rgba(var(--rs-ink), 0.04);
    --lumo-contrast-10pct: rgba(var(--rs-ink), 0.08);
    --lumo-contrast-20pct: rgba(var(--rs-ink), 0.14);
    --lumo-border-radius-m: 10px;
    --lumo-border-radius-l: 14px;
}

/* ============================================================
   Dark mode (plano, sin degradados)
   ============================================================ */

html[data-theme="dark"] {
    --rs-bg: #0e1420;
    --rs-surface: #151c2b;
    --rs-surface-2: #121826;
    --rs-card: #151c2b;
    --rs-card-2: #151c2b;
    --rs-hairline: #263249;
    --rs-hairline-2: #1f2a3d;
    --rs-text: #eef2f9;
    --rs-text-dim: #9db0c9;
    --rs-faint: #6f8199;
    --rs-accent: #7da5ff;
    --rs-accent-strong: #9dc0ff;
    --rs-accent-tint: #1d2a44;
    --rs-ring: rgba(125, 165, 255, 0.28);
    --rs-like: #ff7a93;
    --rs-success: #3dd68c;
    --rs-danger: #ff7f86;
    --rs-ink: 0, 0, 0;

    --rs-hover: #1d2739;
    --rs-hover-active: #232f45;
    --rs-faint-bg: #121826;
    --rs-scrollbar: #33415c;
    --rs-scrollbar-hover: #43557a;
    --rs-border-strong: #3a4a68;
    --rs-track: #1a2334;

    --rs-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.45);
    --rs-shadow-2: 0 2px 6px rgba(0, 0, 0, 0.45), 0 12px 28px rgba(0, 0, 0, 0.5);

    --lumo-base-color: #151c2b;
    --lumo-primary-color: #7da5ff;
    --lumo-primary-color-50pct: rgba(125, 165, 255, 0.5);
    --lumo-primary-color-10pct: rgba(125, 165, 255, 0.12);
    --lumo-primary-text-color: #9dc0ff;
    --lumo-body-text-color: #eef2f9;
    --lumo-secondary-text-color: #9db0c9;
    --lumo-contrast-10pct: rgba(125, 165, 255, 0.14);
    --lumo-contrast-20pct: rgba(125, 165, 255, 0.22);
}

/* ============================================================
   Base
   ============================================================ */

html,
body {
    margin: 0;
    height: 100%;
    background: var(--rs-bg);
    color: var(--rs-text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--rs-scrollbar); border-radius: var(--rs-pill); border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--rs-scrollbar-hover); border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   Shell / AppLayout
   ============================================================ */

.app-layout {
    --vaadin-app-layout-drawer-offset-size: 264px;
    --vaadin-app-layout-navbar-offset-size: 0px !important;
    --_vaadin-app-layout-navbar-offset-size: 0px !important;
}

/* El navbar flota por encima del contenido (sin reservar 61px de offset) */
.app-layout::part(navbar) {
    background: var(--rs-surface);
    border-bottom: 1px solid var(--rs-hairline);
    padding: 0px;
    z-index: 20;
}

.app-layout::part(content) {
    padding-top: 60px;
}

.app-layout::part(drawer) {
    background: var(--rs-surface);
    border-right: 1px solid var(--rs-hairline);
}

.app-layout::part(backdrop) { background: rgba(var(--rs-ink), 0.35); backdrop-filter: blur(2px); }

.app-navbar {
    height: 60px;
    min-height: 60px;
    width: 100% !important;
    max-width: none;
    margin: 0;
    padding: 0;
    gap: 16px;
    background: transparent;
    border: none;
    box-shadow: none;
    justify-content: space-between;
}

.app-navbar .app-brand { margin: 0; }

/* Acciones del navbar (buscar, publicar, tema, avatar) */
.app-nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
}
.app-search {
    width: 240px;
    max-width: 40vw;
}
.app-search vaadin-text-field { width: 100%; }
.app-search ::part(input-field) {
    background: var(--rs-faint-bg);
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-pill);
    min-height: 38px;
    padding: 0 4px 0 14px;
}
.app-search ::part(input-field):focus-within { border-color: var(--rs-accent); box-shadow: 0 0 0 3px var(--rs-ring); }

.app-theme-toggle {
    width: 38px;
    height: 38px;
    min-width: 38px;
    padding: 0;
    border-radius: var(--rs-pill);
    color: var(--rs-text-dim);
    background: var(--rs-faint-bg);
    border: 1px solid var(--rs-hairline);
}
.app-theme-toggle:hover { color: var(--rs-accent-strong); border-color: var(--rs-border-strong); }
.app-theme-toggle vaadin-icon { margin: 0; }

.app-user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px 4px 6px;
    border-radius: var(--rs-pill);
    border: 1px solid var(--rs-hairline);
    background: var(--rs-faint-bg);
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--rs-text);
    cursor: pointer;
}
.app-user-chip:hover { border-color: var(--rs-border-strong); }

.app-sidebar {
    width: 100%;
    height: 100%;
    padding: 18px 14px;
    box-sizing: border-box;
    border-right: 1px solid var(--rs-hairline);
    background: transparent;
}

.app-brand-box { margin: 6px 0 22px; }

.app-brand {
    font-size: 1.28rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--rs-text);
}

.app-brand::before {
    content: "◍";
    color: var(--rs-accent);
    margin-right: 9px;
}

.app-nav { gap: 4px; }

.app-nav-item {
    justify-content: flex-start;
    height: 44px;
    border-radius: var(--rs-radius-s);
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--rs-text-dim);
    background: transparent;
    cursor: pointer;
    transition: background 0.25s var(--rs-ease), color 0.25s var(--rs-ease);
}

.app-nav-item::part(label) { margin-left: 14px; }
.app-nav-item:hover { background: var(--rs-hover); color: var(--rs-text); }
.app-nav-item:active { background: var(--rs-hover-active); }
.app-nav-item:focus-visible { outline: 2px solid var(--rs-accent); outline-offset: -2px; }
.app-nav-item.active {
    background: var(--rs-accent-tint);
    color: var(--rs-accent-strong);
    font-weight: 700;
}
.app-nav-item.active::part(label) { font-weight: 700; }
.app-nav-item.active .app-nav-icon { color: var(--rs-accent); }

.app-nav-icon { color: var(--rs-faint); transition: color 0.25s var(--rs-ease); }
.app-nav-item:hover .app-nav-icon { color: var(--rs-text-dim); }
.app-nav-item.active .app-nav-icon { color: var(--rs-accent); }

.app-user {
    border-top: 1px solid var(--rs-hairline);
    gap: 10px;
    background: var(--rs-surface-2);
    border-radius: var(--rs-radius-m);
    padding: 14px;
}
.app-user-name { font-weight: 700; color: var(--rs-text); font-size: 0.92rem; }
.app-user-handle { font-size: 0.8rem; color: var(--rs-text-dim); }

.app-logout {
    justify-content: flex-start;
    color: var(--rs-danger);
    border-radius: var(--rs-radius-s);
    font-weight: 600;
    transition: background 0.25s var(--rs-ease);
}
.app-logout::part(label) { margin-left: 14px; }
.app-logout:hover { background: rgba(var(--rs-danger-rgb), 0.08); color: var(--rs-danger); }

.app-content { height: 100vh; overflow-y: auto; box-sizing: border-box; }

/* Columna única estilo X: flush vertical con hairline */
.page-container {
    max-width: var(--rs-col);
    margin: 0 auto;
    padding: 60px 0 92px;
    width: 100%;
    box-sizing: border-box;
    min-height: 100vh;
    background: var(--rs-surface);
    border-left: 1px solid var(--rs-hairline);
    border-right: 1px solid var(--rs-hairline);
    animation: rs-fade-up 0.5s var(--rs-ease) both;
}
.page-container::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 45;
    pointer-events: none;
    background: linear-gradient(110deg, transparent 42%, rgba(255, 255, 255, 0.06) 50%, transparent 58%);
    animation: rs-sweep 1.15s cubic-bezier(0.3, 0, 0.2, 1) both;
}

/* Layout con rail derecho (≥1600px) */
.layout-with-rail {
    display: flex;
    max-width: calc(var(--rs-col) + var(--rs-rail) + 40px);
    margin: 0 auto;
    align-items: flex-start;
    justify-content: center;
}
.layout-with-rail > .layout-main { flex: 1 1 auto; max-width: var(--rs-col); min-width: 0; }
.layout-with-rail > .layout-rail { display: none; }

.app-rail {
    position: sticky;
    top: 76px;
    width: var(--rs-rail);
    flex: 0 0 var(--rs-rail);
    margin-left: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.rail-card {
    background: var(--rs-surface);
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-radius-l);
    padding: 14px 16px;
    box-shadow: var(--rs-shadow-1);
}
.rail-title {
    font-weight: 800;
    font-size: 1.02rem;
    margin: 0 0 10px;
    display: block;
}
.rail-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rs-hairline-2);
    cursor: pointer;
}
.rail-row:last-child { border-bottom: none; }
.rail-row:hover .rail-link { color: var(--rs-accent-strong); }
.rail-link { color: var(--rs-text); font-weight: 600; font-size: 0.9rem; flex: 1; }
.rail-sub { color: var(--rs-text-dim); font-size: 0.8rem; }

@media (min-width: 1600px) {
    .layout-with-rail > .layout-rail { display: block; }
}

/* ============================================================
   Tipografía de página
   ============================================================ */

.page-header {
    padding: 20px var(--rs-gutter) 14px;
    border-bottom: 1px solid var(--rs-hairline);
    background: var(--rs-surface);
}

.page-title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin: 6px 0 0;
    display: block;
}

.eyebrow {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--rs-accent-strong);
    display: inline-block;
    padding: 5px 12px;
    border-radius: var(--rs-radius-s);
    background: var(--rs-accent-tint);
    border: 1px solid rgba(91, 141, 238, 0.25);
}
html[data-theme="dark"] .eyebrow { border-color: rgba(125, 165, 255, 0.25); }

/* ============================================================
   Avatares (anillo claro + gradiente de inicial)
   ============================================================ */

.rs-avatar {
    --vaadin-avatar-size: 42px;
    flex: none;
    box-shadow: 0 0 0 2px var(--rs-surface), 0 0 0 3px var(--rs-hairline), 0 2px 8px rgba(var(--rs-ink), 0.08);
}
.rs-avatar-sm { --vaadin-avatar-size: 40px; }
.rs-avatar-lg {
    --vaadin-avatar-size: 122px;
    --vaadin-avatar-outline-width: 4px;
    box-shadow: 0 0 0 4px var(--rs-surface), 0 0 0 5px rgba(255, 255, 255, 0.6), 0 10px 22px rgba(var(--rs-ink), 0.14);
}

/* ============================================================
   Feed / Publicaciones  (flush, separadas por hairline)
   ============================================================ */

.post-card {
    background: var(--rs-card);
    border: none;
    border-bottom: 1px solid var(--rs-hairline);
    border-radius: 0;
    padding: 16px var(--rs-gutter);
    margin: 0;
    box-shadow: none;
    transition: background 0.25s var(--rs-ease);
    animation: rs-fade-up 0.45s var(--rs-ease) both;
    cursor: default;
}

.post-card:hover { background: var(--rs-hover); }

.post-card::part(content) { gap: 10px; }

.post-author { font-weight: 700; color: var(--rs-text); font-size: 0.95rem; }
.post-author:hover { text-decoration: underline; }
.post-handle { color: var(--rs-text-dim); font-size: 0.86rem; }
.post-content { white-space: pre-wrap; line-height: 1.55; margin: 0; font-size: 0.97rem; color: var(--rs-text); }

/* Imagen del post (media premium) */
.post-media {
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-radius-m);
    object-fit: cover;
    aspect-ratio: 16 / 10;
    max-height: 480px;
    display: block;
    cursor: zoom-in;
    background: var(--rs-track);
}
.post-media[data-loaded="false"] { opacity: 0; }

/* Lightbox */
.lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(var(--rs-ink), 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    animation: rs-fade-in 0.25s var(--rs-ease) both;
}
.lightbox img { max-width: 92vw; max-height: 92vh; border-radius: var(--rs-radius-m); box-shadow: var(--rs-shadow-2); }

/* Action bar separada por hairline superior */
.post-actions {
    justify-content: space-between;
    gap: 4px;
    margin: 4px 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--rs-hairline-2);
}

.action-btn {
    border-radius: var(--rs-radius-s);
    color: var(--rs-text-dim);
    font-weight: 600;
    padding: 6px 12px;
    gap: 6px;
    transition: background 0.25s var(--rs-ease), color 0.25s var(--rs-ease);
}
.action-btn[theme~="error"]:hover { background: rgba(213, 74, 82, 0.08); }

.action-btn:hover { color: var(--rs-accent-strong); background: var(--rs-accent-tint); }
.action-btn.liked { color: var(--rs-like); font-weight: 700; }
.action-btn.liked:hover { background: rgba(224, 69, 95, 0.1); }
.action-btn.liked vaadin-icon { animation: rs-heart-pop 0.4s var(--rs-ease); }
@keyframes rs-heart-pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.4); }
    100% { transform: scale(1); }
}

/* ============================================================
   Composer (flush) + refinado
   ============================================================ */

.composer {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 16px var(--rs-gutter);
    margin: 0;
    border: none;
    border-bottom: 1px solid var(--rs-hairline);
    border-radius: 0;
    background: var(--rs-card);
    box-shadow: none;
    animation: rs-fade-up 0.45s var(--rs-ease) both;
}

.composer vaadin-text-area { --lumo-contrast-20pct: var(--rs-hairline); }

.composer-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
}
.composer-count {
    color: var(--rs-faint);
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
}

/* Inputs */
vaadin-text-field::part(input-field),
vaadin-password-field::part(input-field),
vaadin-text-area::part(input-field) {
    background: var(--rs-surface);
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-radius-s);
    box-shadow: inset 0 1px 2px rgba(var(--rs-ink), 0.02);
    transition: border-color 0.25s var(--rs-ease), box-shadow 0.25s var(--rs-ease);
}

vaadin-text-field::part(input-field):hover,
vaadin-text-area::part(input-field):hover,
vaadin-password-field::part(input-field):hover {
    border-color: var(--rs-border-strong);
}

vaadin-text-field::part(input-field):focus-within,
vaadin-text-area::part(input-field):focus-within,
vaadin-password-field::part(input-field):focus-within {
    border-color: var(--rs-accent);
    box-shadow: 0 0 0 3px var(--rs-ring);
}

/* ============================================================
   Botones
   ============================================================ */

vaadin-button {
    border-radius: var(--rs-radius-s);
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.25s var(--rs-ease), box-shadow 0.25s var(--rs-ease);
}
vaadin-button:active { transform: scale(0.98); }

vaadin-button[theme~="primary"] {
    background: var(--rs-accent);
    color: #ffffff;
    border: none;
    box-shadow: 0 8px 20px -8px rgba(91, 141, 238, 0.7);
    position: relative;
    overflow: hidden;
}
html[data-theme="dark"] vaadin-button[theme~="primary"] { color: #0e1420; }
vaadin-button[theme~="primary"]::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, 0.28) 50%, transparent 65%);
    transform: translateX(-120%);
    animation: rs-shine 4.5s cubic-bezier(0.3, 0, 0.2, 1) infinite;
}
@keyframes rs-shine {
    0% { transform: translateX(-120%); }
    55% { transform: translateX(120%); }
    100% { transform: translateX(120%); }
}
vaadin-button[theme~="primary"]:hover {
    background: var(--rs-accent-strong);
    box-shadow: 0 10px 24px -8px rgba(91, 141, 238, 0.85);
    transform: translateY(-1px);
}

vaadin-button[theme~="contrast"] {
    background: var(--rs-surface);
    color: var(--rs-text);
    border: 1px solid var(--rs-hairline);
    box-shadow: var(--rs-shadow-1);
}
vaadin-button[theme~="contrast"]:hover {
    background: var(--rs-surface-2);
    border-color: var(--rs-border-strong);
    transform: translateY(-1px);
}

vaadin-button:focus-visible {
    outline: 2px solid var(--rs-accent);
    outline-offset: 2px;
}

/* ============================================================
   Perfil (jerarquía: cover → identidad → stats → acciones)
   ============================================================ */

.profile-cover {
    height: 200px;
    position: relative;
    margin-bottom: 66px;
    border-bottom: 1px solid var(--rs-hairline);
    background: linear-gradient(180deg, #5b8dee 0%, #4a7fe2 100%);
    animation: rs-fade-up 0.5s var(--rs-ease) both;
}
html[data-theme="dark"] .profile-cover { background: linear-gradient(180deg, #28436b 0%, #1c3050 100%); }

.profile-avatar {
    position: absolute;
    left: var(--rs-gutter);
    bottom: -54px;
    border-radius: 50%;
}

.profile-head { padding: 0 var(--rs-gutter); }

.profile-name {
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
}
.profile-handle { color: var(--rs-text-dim); margin-top: 2px; }

.profile-bio {
    color: var(--rs-text-dim);
    margin: 10px 0 0;
    line-height: 1.55;
}

.profile-stats {
    gap: 0;
    margin-top: 14px;
    width: fit-content;
    background: var(--rs-surface-2);
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-radius-m);
    overflow: hidden;
}

.stat-pill {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 10px 18px;
    color: var(--rs-text-dim);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    box-shadow: none;
    transition: background 0.25s var(--rs-ease);
}
.stat-pill + .stat-pill { border-left: 1px solid var(--rs-hairline); }
.stat-pill:hover { background: var(--rs-accent-tint); }
.stat-pill b { color: var(--rs-text); font-weight: 700; display: block; font-size: 1rem; }

.profile-actions { margin-top: 14px; gap: 8px; }

.profile-back {
    gap: 6px;
    color: var(--rs-text-dim);
    font-weight: 600;
    align-self: flex-start;
}
.profile-back:hover { color: var(--rs-accent-strong); }

/* Tabs del perfil */
.profile-tabs {
    margin-top: 20px;
    border-bottom: 1px solid var(--rs-hairline);
    background: var(--rs-surface);
}
.profile-tabs::part(tabs) { gap: 0; }
.profile-tabs::part(tab) { padding: 12px 20px; font-weight: 600; color: var(--rs-text-dim); border-bottom: 2px solid transparent; }
.profile-tabs::part(tab):hover { color: var(--rs-text); background: var(--rs-hover); }
.profile-tabs vaadin-tab[selected] { color: var(--rs-accent-strong); border-bottom-color: var(--rs-accent); }

.profile-section {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rs-text-dim);
    margin: 26px var(--rs-gutter) 6px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rs-hairline);
}

/* ============================================================
   Explorar (grid 2 col ≥1200px)
   ============================================================ */

.user-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--rs-card);
    border: none;
    border-bottom: 1px solid var(--rs-hairline);
    border-radius: 0;
    padding: 14px var(--rs-gutter);
    margin: 0;
    box-shadow: none;
    transition: background 0.25s var(--rs-ease);
    animation: rs-fade-up 0.4s var(--rs-ease) both;
}

.user-card:hover { background: var(--rs-hover); }

@media (min-width: 1200px) {
    .explore-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }
    .explore-grid .user-card { padding-left: 16px; padding-right: 16px; }
}

/* ============================================================
   Proyectos
   ============================================================ */

.projects-tabs {
    border-bottom: 1px solid var(--rs-hairline);
    background: var(--rs-surface);
}
.projects-tabs::part(tabs) { gap: 0; }
.projects-tabs::part(tab) {
    padding: 12px 20px;
    font-weight: 600;
    color: var(--rs-text-dim);
    border-bottom: 2px solid transparent;
}
.projects-tabs::part(tab):hover { color: var(--rs-text); background: var(--rs-hover); }
.projects-tabs vaadin-tab[selected] { color: var(--rs-accent-strong); border-bottom-color: var(--rs-accent); }

.project-card {
    background: var(--rs-card);
    border: none;
    border-bottom: 1px solid var(--rs-hairline);
    border-radius: 0;
    padding: 16px var(--rs-gutter);
    margin: 0;
    box-shadow: none;
    transition: background 0.25s var(--rs-ease);
    animation: rs-fade-up 0.4s var(--rs-ease) both;
    position: relative;
}
.project-card:hover { background: var(--rs-hover); }

.project-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--rs-text);
    display: block;
    margin: 4px 0 4px;
}
.project-description {
    color: var(--rs-text-dim);
    font-size: 0.93rem;
    line-height: 1.55;
    display: block;
    white-space: pre-wrap;
}

.project-meta { gap: 12px; margin-top: 12px; color: var(--rs-text-dim); font-size: 0.9rem; }

.date-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 52px;
    height: 52px;
    background: var(--rs-accent-tint);
    border: 1px solid rgba(91, 141, 238, 0.28);
    border-radius: var(--rs-radius-m);
    flex: none;
}
html[data-theme="dark"] .date-badge { border-color: rgba(125, 165, 255, 0.3); }
.date-badge-day { font-size: 1.15rem; font-weight: 800; color: var(--rs-accent-strong); line-height: 1; }
.date-badge-month { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; color: var(--rs-accent-strong); text-transform: uppercase; margin-top: 2px; }

.project-progress { margin-top: 12px; height: 8px; }
.project-progress::part(value) { background: var(--rs-accent); }
.project-counter { color: var(--rs-text-dim); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.project-donate { margin-left: auto; flex: none; }

.project-status {
    display: inline-block;
    margin-top: 12px;
    padding: 5px 12px;
    border-radius: var(--rs-pill);
    font-size: 0.78rem;
    font-weight: 700;
}
.project-status.status-proposed { background: #fff3d6; color: #9a6b00; }
.project-status.status-in_progress { background: var(--rs-accent-tint); color: var(--rs-accent-strong); }
.project-status.status-completed { background: #e0f5ea; color: #116b45; }
html[data-theme="dark"] .project-status.status-proposed { background: #3a3217; color: #e6c86a; }
html[data-theme="dark"] .project-status.status-completed { background: #123223; color: #5fd6a3; }

.project-delete { position: absolute; top: 16px; right: 20px; }

/* ============================================================
   Chat (centrado, con límite de ancho)
   ============================================================ */

.chat-shell { height: 100vh; width: 100%; max-width: 1180px; margin: 0 auto; }

.conversation-list {
    width: 320px;
    min-width: 320px;
    height: 100%;
    overflow-y: auto;
    border-right: 1px solid var(--rs-hairline);
    background: var(--rs-surface-2);
    padding: 16px 12px;
    box-sizing: border-box;
}

.conv-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin: 0 0 4px;
    border-radius: var(--rs-radius-m);
    border: 1px solid transparent;
    cursor: pointer;
    position: relative;
    box-sizing: border-box;
    transition: background 0.25s var(--rs-ease), border-color 0.25s var(--rs-ease);
    animation: rs-fade-up 0.4s var(--rs-ease) both;
}

.conv-item:hover { background: var(--rs-surface); border-color: var(--rs-hairline); }
.conv-item.active { background: var(--rs-accent-tint); border-color: rgba(91, 141, 238, 0.4); }
html[data-theme="dark"] .conv-item.active { border-color: rgba(125, 165, 255, 0.45); }
.conv-item.active::before {
    content: "";
    position: absolute;
    left: -12px;
    top: 10px;
    bottom: 10px;
    width: 3px;
    border-radius: 3px;
    background: var(--rs-accent);
}

.conv-preview { color: var(--rs-text-dim); font-size: 0.85rem; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.conv-badge {
    background: var(--rs-accent);
    color: #ffffff;
    border-radius: var(--rs-pill);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
}
html[data-theme="dark"] .conv-badge { color: #0e1420; }

.conv-online {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--rs-success);
    flex: none;
    box-shadow: 0 0 0 2px var(--rs-surface);
}

.message-thread {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--rs-surface-2);
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
}

.message-bubble {
    max-width: 72%;
    align-self: flex-start;
    padding: 11px 16px;
    border-radius: 18px 18px 18px 6px;
    background: var(--rs-surface);
    border: 1px solid var(--rs-hairline);
    box-shadow: var(--rs-shadow-1);
    line-height: 1.5;
    white-space: pre-wrap;
    animation: rs-fade-up 0.35s var(--rs-ease) both;
}

.message-bubble.mine {
    align-self: flex-end;
    background: var(--rs-accent);
    border-color: var(--rs-accent);
    color: #ffffff;
    border-radius: 18px 18px 6px 18px;
    box-shadow: 0 8px 20px -8px rgba(91, 141, 238, 0.7);
}
html[data-theme="dark"] .message-bubble.mine { color: #0e1420; }

.message-time {
    font-size: 0.68rem;
    color: var(--rs-text-dim);
    align-self: flex-start;
    margin: 0 6px 8px;
}
.message-time.mine { align-self: flex-end; }

.typing-indicator {
    padding: 4px var(--rs-gutter);
    font-size: 0.8rem;
    color: var(--rs-text-dim);
    font-style: italic;
}

.chat-composer {
    padding: 14px 18px;
    border-top: 1px solid var(--rs-hairline);
    background: var(--rs-surface);
}

/* ============================================================
   Autenticación: split 55/45 fijo
   ============================================================ */

.auth-split {
    min-height: 100vh;
    display: flex;
    flex-direction: row;
    background: var(--rs-bg);
    animation: rs-fade-up 0.5s var(--rs-ease) both;
}

.auth-hero {
    flex: 0 0 55%;
    min-width: 0;
    background: linear-gradient(160deg, #4a7fe2 0%, #356fd3 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 6% 7%;
    box-sizing: border-box;
    overflow: hidden;
    position: relative;
}

.auth-logo {
    position: absolute;
    top: 28px;
    left: 30px;
    height: 64px;
    width: auto;
    z-index: 2;
    animation: rs-logo-in 0.9s var(--rs-ease) both;
}

.auth-lottie {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 1560px;
    height: 120%;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    pointer-events: none;
    animation: rs-drift 16s ease-in-out infinite;
}
.auth-lottie::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
            rgba(14, 55, 134, 0.66) 0%,
            rgba(14, 55, 134, 0.42) 42%,
            rgba(14, 55, 134, 0.12) 100%);
}
.auth-lottie .lottie-box {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.auth-lottie svg {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: 100%;
}

.auth-hero .eyebrow,
.auth-hero h1,
.auth-hero p {
    color: white;
    position: relative;
    z-index: 2;
}

.auth-hero .eyebrow {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.28);
    animation: rs-slide-in 0.7s var(--rs-ease) both;
}
.auth-hero h1 {
    font-size: clamp(2rem, 3.6vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 18px 0 20px;
    line-height: 1.08;
    max-width: 480px;
    animation: rs-slide-in 0.7s var(--rs-ease) 0.12s both;
}
.auth-hero p {
    font-size: 1.02rem;
    color: rgba(255, 255, 255, 0.88);
    max-width: 440px;
    line-height: 1.6;
    margin: 0 0 8px;
    text-align: left;
    animation: rs-slide-in 0.7s var(--rs-ease) 0.24s both;
}
.auth-card {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: var(--rs-card);
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-radius-xl);
    padding: 34px !important;
    box-sizing: border-box;
    box-shadow: var(--rs-shadow-2);
    animation: rs-card-in 0.6s var(--rs-ease) 0.1s both;
}

/* Texto del formulario de autenticación en blanco (modo oscuro fijo) */
.auth-card h1,
.auth-card .auth-card-title {
    color: #ffffff !important;
    margin: 0;
    font-size: 1.5rem;
}
.auth-card vaadin-text-field::part(label),
.auth-card vaadin-password-field::part(label) {
    color: #dbe3f0 !important;
}
.auth-card vaadin-text-field::part(input-field) input,
.auth-card vaadin-password-field::part(input-field) input {
    color: #ffffff !important;
}
.auth-card vaadin-text-field::part(input-field),
.auth-card vaadin-password-field::part(input-field) {
    background: rgba(255, 255, 255, 0.06) !important;
    border-color: rgba(255, 255, 255, 0.18) !important;
}
.auth-card vaadin-text-field::part(input-field):hover,
.auth-card vaadin-password-field::part(input-field):hover {
    border-color: rgba(255, 255, 255, 0.3) !important;
}
.auth-card vaadin-text-field::part(input-field):focus-within,
.auth-card vaadin-password-field::part(input-field):focus-within {
    border-color: var(--rs-accent) !important;
    box-shadow: 0 0 0 3px var(--rs-ring) !important;
}
.auth-card vaadin-button[theme~="tertiary"] {
    color: #b9c6dc !important;
}
.auth-card vaadin-button[theme~="tertiary"]:hover {
    color: #ffffff !important;
}

.auth-panel {
    flex: 1 1 45%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center !important;
    justify-content: center;
    padding: 48px;
    box-sizing: border-box;
}

/* ============================================================
   Estados vacíos con icono
   ============================================================ */

.empty-state {
    text-align: center;
    padding: 48px 22px;
    color: var(--rs-text-dim);
    margin: 16px var(--rs-gutter);
    border: 1px dashed var(--rs-border-strong);
    border-radius: var(--rs-radius-m);
    background: var(--rs-surface-2);
}

.empty-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    border-radius: var(--rs-pill);
    background: var(--rs-accent-tint);
    color: var(--rs-accent-strong);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
}

.empty-state b { color: var(--rs-text); display: block; margin-bottom: 6px; font-size: 1.05rem; font-weight: 700; }

.muted { color: var(--rs-text-dim); }

.card {
    background: var(--rs-card);
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-radius-m);
    padding: 14px;
    box-shadow: var(--rs-shadow-1);
}

/* ============================================================
   Skeletons
   ============================================================ */

.skeleton {
    background: linear-gradient(100deg,
            var(--rs-track) 40%,
            var(--rs-surface) 50%,
            var(--rs-track) 60%);
    background-size: 200% 100%;
    animation: rs-shimmer 1.4s ease infinite;
    border-radius: var(--rs-radius-s);
}
.skeleton-line { height: 12px; width: 70%; }
.skeleton-line.skeleton-wide { width: 92%; }
.skeleton-circle { border-radius: 50%; flex: none; }
.skeleton-block { height: 180px; width: 100%; border-radius: var(--rs-radius-m); }

@keyframes rs-shimmer {
    0% { background-position: 130% 0; }
    100% { background-position: -130% 0; }
}

.skeleton-card {
    display: flex;
    gap: 12px;
    padding: 16px var(--rs-gutter);
    border-bottom: 1px solid var(--rs-hairline);
}
.skeleton-card .skel-body { flex: 1; display: flex; flex-direction: column; gap: 10px; }

/* ============================================================
   Diálogos / notificaciones / campana
   ============================================================ */

vaadin-dialog-overlay::part(backdrop) {
    background: rgba(var(--rs-ink), 0.38);
    backdrop-filter: blur(2px);
    animation: rs-fade-in 0.2s var(--rs-ease) both;
}

vaadin-dialog-overlay::part(overlay) {
    background: var(--rs-surface);
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-radius-l);
    box-shadow: var(--rs-shadow-2);
    animation: rs-card-in 0.3s var(--rs-ease) both;
}

vaadin-dialog-overlay::part(title) { font-weight: 700; }

vaadin-notification-card {
    background: var(--rs-surface);
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-radius-m);
    color: var(--rs-text);
    box-shadow: var(--rs-shadow-2);
    animation: rs-toast-in 0.35s var(--rs-ease) both;
}
@keyframes rs-toast-in {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: none; }
}

.app-bell { margin: 6px 0 4px; }

.notifications-bell { position: relative; width: 100%; }
.notifications-bell-button {
    justify-content: flex-start;
    gap: 12px;
    height: 44px;
    padding: 0 12px;
    border-radius: var(--rs-radius-s);
    color: var(--rs-text-dim);
    background: transparent;
    font-weight: 600;
}
.notifications-bell-button vaadin-icon { color: var(--rs-faint); }
.notifications-bell-button:hover { background: var(--rs-hover); color: var(--rs-text); }

.notifications-badge {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: var(--rs-pill);
    background: var(--rs-like);
    color: #ffffff;
    font-size: 0.7rem;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
    box-sizing: border-box;
}

.notification-row {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--rs-hairline-2);
    transition: background 0.2s var(--rs-ease);
}
.notification-row:hover { background: var(--rs-hover); }
.notification-row.unread { background: var(--rs-accent-tint); }

.notification-content { display: flex; gap: 10px; align-items: flex-start; flex: 1; }

.notification-icon {
    width: 30px;
    height: 30px;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--rs-pill);
    background: var(--rs-accent-tint);
    color: var(--rs-accent-strong);
    font-weight: 700;
    font-size: 0.8rem;
}

.notification-text { color: var(--rs-text); font-size: 0.9rem; line-height: 1.45; }

.composer-preview {
    border: 1px solid var(--rs-hairline);
    border-radius: var(--rs-radius-m);
    max-height: 320px;
    object-fit: cover;
}

.feed-upload { width: auto; }

vaadin-upload { width: auto; }
vaadin-upload::part(primary-buttons) { padding: 0; }
vaadin-upload .primary-buttons [part="start"] {
    padding: 8px 12px;
    border-radius: var(--rs-radius-s);
    color: var(--rs-text-dim);
    background: var(--rs-surface-2);
    border: 1px solid var(--rs-hairline);
    font-weight: 600;
}
vaadin-upload .primary-buttons [part="start"]:hover { color: var(--rs-accent-strong); border-color: var(--rs-border-strong); }

/* ============================================================
   Utility classes (para eliminar estilos inline de Java)
   ============================================================ */

/* LottieView ya usa .auth-lottie (dimensiones en CSS) */
.lottie-box {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Avatares con gradiente por hue (estilo declarativo) */
.rs-avatar {
    --vaadin-avatar-text-color: #ffffff;
}
.avatar-fallback {
    width: 42px;
    height: 42px;
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: #ffffff;
    font-weight: 700;
    user-select: none;
    flex: none;
}
.avatar-hue-0 { background: linear-gradient(135deg, #5b8dee, #356fd3); }
.avatar-hue-1 { background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
.avatar-hue-2 { background: linear-gradient(135deg, #06b6d4, #0e7490); }
.avatar-hue-3 { background: linear-gradient(135deg, #10b981, #059669); }
.avatar-hue-4 { background: linear-gradient(135deg, #f59e0b, #b45309); }
.avatar-hue-5 { background: linear-gradient(135deg, #ef4444, #b91c1c); }
.avatar-hue-6 { background: linear-gradient(135deg, #ec4899, #be185d); }
.avatar-hue-7 { background: linear-gradient(135deg, #6366f1, #4338ca); }
.avatar-hue-8 { background: linear-gradient(135deg, #14b8a6, #0f766e); }
.avatar-hue-9 { background: linear-gradient(135deg, #f97316, #c2410c); }
.rs-avatar.avatar-hue-0 { --vaadin-avatar-background: linear-gradient(135deg, #5b8dee, #356fd3); }
.rs-avatar.avatar-hue-1 { --vaadin-avatar-background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
.rs-avatar.avatar-hue-2 { --vaadin-avatar-background: linear-gradient(135deg, #06b6d4, #0e7490); }
